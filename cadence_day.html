function findBlock(id, dateKey){
  const day = peekDay(dateKey || logicalToday());
  return day ? day.blocks.find(b => b.id === id) : null;
}
function handleAct(act, el){
  const dk = logicalToday();
  switch (act) {
    case 'set-time': {
      const t = document.getElementById(el.dataset.target);
      if (t) { t.value = el.dataset.value; t.focus(); }
      break;
    }
    case 'fill-goal': {
      const input = $('input[name="goal"]');
      if (input) { input.value = el.dataset.goal; input.focus(); }
      break;
    }
    case 'skip-prev-sleep': {
      ensureDay(dk).prevSleepAsked = true;
      save(); render();
      break;
    }
    case 'review': {
      const b = findBlock(el.dataset.id, el.dataset.date);
      if (!b) break;
      const st = ['partial','missed','skipped'].indexOf(el.dataset.status) >= 0 ? el.dataset.status : 'done';
      b.status = st;
      b.doneAt = Date.now();
      const note = $('#reviewNote');
      if (note && note.value.trim()) b.note = note.value.trim().slice(0, 280);
      save(); render();
      toast(st === 'done' ? 'Logged as done.' :
            st === 'partial' ? 'Logged as partly done.' :
            st === 'skipped' ? 'Skipped — it is out of the way.' :
            'Logged as missed. The next block is a fresh start.');
      break;
    }
    case 'finish': {
      const b = findBlock(el.dataset.id);
      if (!b) break;
      b.status = 'done'; b.doneAt = Date.now();
      save(); render();
      toast('Done early. Nice.');
      break;
    }
    case 'start-block': {
      const b = findBlock(el.dataset.id);
      if (!b) break;
      const now = Math.floor(nowMin() / 5) * 5;
      b.start = fromMin(now);
      if (toMin(b.end) <= now) b.end = fromMin(Math.min(now + 60, 23*60 + 59));
      save(); render();
      toast('Started. Go.');
      break;
    }
    case 'edit-block': openBlockModal(el.dataset.id, el.dataset.date); break;
    case 'add-block': openBlockModal(null); break;
    case 'open-day': openDayModal(el.dataset.date); break;
    case 'day-add-block': openBlockModal(null, el.dataset.date); break;
    case 'day-delete': {
      const ddk = el.dataset.date;
      if (!peekDay(ddk)) break;
      confirmDialog('Delete this day?', 'Everything logged on ' + fmtDate(ddk) + ' — wake, sleep, blocks, gym and lectures — will be removed.', 'Delete day', function(){
        delete state.days[ddk];
        blockReturn = null;
        saveNow(); closeModal(true); render();
        toast('Day cleared.');
      });
      break;
    }
    case 'dismiss-intro': {
      state.settings.seenIntro = true;
      saveNow(); render();
      break;
    }
    case 'del-block': {
      const bdk = el.dataset.date || dk;
      const b = findBlock(el.dataset.id, bdk);
      if (!b) break;
      confirmDialog('Delete this block?', '“' + b.goal + '” will be removed from ' + (bdk === dk ? 'today' : fmtDate(bdk)) + '. This cannot be undone.', 'Delete block', function(){
        const day = ensureDay(bdk);
        day.blocks = day.blocks.filter(x => x.id !== b.id);
        saveNow();
        const back = blockReturn; blockReturn = null;
        render();
        toast('Block removed.');
        if (back) openDayModal(back);
      });
      break;
    }
    case 'gym-toggle': {
      const day = ensureDay(dk);
      day.gym = !day.gym;
      save(); render();
      toast(day.gym ? 'Gym logged. That is ' + weekStats(weekStartOf(dk)).gym + ' this week.' : 'Gym session removed.');
      break;
    }
    case 'lec': {
      const day = ensureDay(dk);
      const f = el.dataset.f === 'scheduled' ? 'scheduled' : 'attended';
      const d = Number(el.dataset.d) || 0;
      day.lectures[f] = clamp(day.lectures[f] + d, 0, 20);
      if (day.lectures.attended > day.lectures.scheduled) {
        if (f === 'scheduled') day.lectures.attended = day.lectures.scheduled;
        else day.lectures.scheduled = day.lectures.attended;
      }
      save(); render();
      break;
    }
    case 'sleep-log': openSleepModal(); break;
    case 'week-prev': weekOffset -= 1; render(); break;
    case 'week-next': weekOffset += 1; render(); break;
    case 'week-now': weekOffset = 0; render(); break;
    case 'go-week': location.hash = '#/week'; break;
    case 'go-rewards': location.hash = '#/rewards'; break;
    case 'plan-late': planOverride = true; render(); break;
    case 'claim': {
      const st = weekStats(weekStartOf(dk));
      const r = state.rewards.find(x => x.id === el.dataset.id);
      if (!r) break;
      if (st.score == null) { toast('Log a morning before claiming anything.', 'error'); break; }
      if (st.score < r.need) { toast('That needs a ' + r.need + '+ week. You are at ' + st.score + '.', 'error'); break; }
      if (currentClaim()) { toast('You already picked a reward this week.', 'error'); break; }
      state.claimed.push({ id: uid(), week: weekStartOf(dk), rewardId: r.id, title: r.title, at: Date.now(), score: st.score });
      saveNow(); render();
      toast('Claimed: ' + r.title + '. Enjoy it.');
      break;
    }
    case 'unclaim': {
      const w = weekStartOf(dk);
      state.claimed = state.claimed.filter(c => c.week !== w);
      saveNow(); render();
      toast('Claim undone. Pick again when you are ready.');
      break;
    }
    case 'add-reward': openRewardModal(); break;
    case 'del-reward': {
      const r = state.rewards.find(x => x.id === el.dataset.id);
      if (!r) break;
      confirmDialog('Remove this reward?', '“' + r.title + '” will leave the shelf. Past claims stay in your history.', 'Remove', function(){
        state.rewards = state.rewards.filter(x => x.id !== r.id);
        save(); render();
        toast('Reward removed.');
      });
      break;
    }
    case 'idea': {
      const title = el.dataset.title;
      state.rewards.push({ id: uid(), title: title, note: '', need: clamp(Number(el.dataset.need) || 70, 0, 100), createdAt: Date.now() });
      save(); render();
      toast('Added “' + title + '” to the shelf.');
      break;
    }
    case 'export': exportData(); break;
    case 'import-open': openImport(); break;
    case 'clear-week': {
      confirmDialog('Clear this week?', 'Every day, block and log in the current week will be removed. Targets and rewards stay.', 'Clear week', function(){
        weekDays(weekStartOf(dk)).forEach(function(k){ delete state.days[k]; });
        saveNow(); render();
        toast('This week cleared.');
      });
      break;
    }
    case 'reset-all': {
      confirmDialog('Start over?', 'Every day, block, reward and claim on this device will be wiped. There is no undo.', 'Reset everything', function(){
        state = blank();
        saveNow(); planOverride = false; weekOffset = 0;
        render();
        toast('A blank page. Here we go.');
      });
      break;
    }
  }
}

/* ============================================================
   Forms
   ============================================================ */
function handleForm(name, fd, form){
  const dk = logicalToday();
  if (name === 'wake') {
    const t = String(fd.get('wake') || '');
    if (!isTime(t)) { toast('Pick a time first.', 'error'); return; }
    const d = ensureDay(dk);
    d.wake = t; d.closed = false;
    save(); render();
    toast('Morning logged at ' + fmtClock(t) + '.');
    return;
  }
  if (name === 'sleep-prev') {
    const t = String(fd.get('sleep') || '');
    if (!isTime(t)) { toast('Pick a time first.', 'error'); return; }
    const d = ensureDay(dk);
    d.prevSleepAsked = true;
    ensureDay(addDays(dk, -1)).sleep = t;
    save(); render();
    const dur = d.wake ? durBetween(t, d.wake) : null;
    toast(dur == null ? 'Sleep logged.' : fmtDur(dur) + ' in bed. Logged.');
    return;
  }
  if (name === 'block') {
    const start = String(fd.get('start') || '');
    const end = String(fd.get('end') || '');
    const goal = String(fd.get('goal') || '').trim();
    const kind = KINDS.indexOf(String(fd.get('kind'))) >= 0 ? String(fd.get('kind')) : 'focus';
    const note = String(fd.get('note') || '').trim().slice(0, 140);
    const status = STATUSES.indexOf(String(fd.get('status'))) >= 0 ? String(fd.get('status')) : 'planned';
    if (!isTime(start) || !isTime(end)) { toast('Give the block a start and an end.', 'error'); return; }
    if (toMin(end) <= toMin(start)) { toast('The end time needs to be after the start.', 'error'); return; }
    if (!goal) { toast('Give the block a name.', 'error'); return; }
    const bdk = form.dataset.date || dk;
    const day = ensureDay(bdk);
    const id = form.dataset.id;
    const clash = day.blocks.find(x => x.id !== id && toMin(x.start) < toMin(end) && toMin(x.end) > toMin(start));
    if (id) {
      const b = day.blocks.find(x => x.id === id);
      if (!b) return;
      b.start = start; b.end = end; b.goal = goal.slice(0, 90); b.kind = kind; b.note = note;
      if (b.status !== status) { b.status = status; b.doneAt = status === 'planned' ? null : (b.doneAt || Date.now()); }
    } else {
      day.blocks.push({ id: uid(), start: start, end: end, goal: goal.slice(0, 90), kind: kind, status: 'planned', note: note, doneAt: null });
    }
    planOverride = false;
    const back = blockReturn; blockReturn = null;
    if (modalOpen()) closeModal(true);
    save(); render();
    toast((id ? 'Block updated.' : (bdk === dk ? 'Added to your day.' : 'Block added to ' + fmtDate(bdk) + '.')) +
      (clash ? ' It overlaps “' + clash.goal + '”.' : ''));
    if (back) openDayModal(back);
    return;
  }
  if (name === 'sleep') {
    const t = String(fd.get('sleep') || '');
    if (!isTime(t)) { toast('Pick a time first.', 'error'); return; }
    const d = ensureDay(dk);
    d.sleep = t; d.closed = true;
    const mood = Number(fd.get('mood'));
    if (mood >= 1 && mood <= 5) d.mood = mood;
    d.note = String(fd.get('note') || '').trim().slice(0, 400);
    save(); render();
    toast('Night logged. Sleep well.');
    return;
  }
  if (name === 'sleep-modal') {
    const prev = String(fd.get('prevSleep') || '');
    const tonight = String(fd.get('sleep') || '');
    let changed = false;
    if (isTime(prev)) { ensureDay(addDays(dk, -1)).sleep = prev; changed = true; }
    if (isTime(tonight)) { ensureDay(dk).sleep = tonight; changed = true; }
    if (!changed) { toast('Pick at least one time.', 'error'); return; }
    save();
    closeModal(true);
    render();
    toast('Sleep saved.');
    return;
  }
  if (name === 'day') {
    const ddk = form.dataset.date || dk;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ddk)) return;
    const day = ensureDay(ddk);
    const wake = String(fd.get('wake') || '').trim();
    const sleep = String(fd.get('sleep') || '').trim();
    if (isTime(wake)) day.wake = wake;
    if (isTime(sleep)) day.sleep = sleep;
    day.gym = !!fd.get('gym');
    let sched = clamp(Math.round(Number(fd.get('lecSched')) || 0), 0, 20);
    let att = clamp(Math.round(Number(fd.get('lecAtt')) || 0), 0, 20);
    if (att > sched) sched = att;
    day.lectures = { attended: att, scheduled: sched };
    day.note = String(fd.get('note') || '').trim().slice(0, 400);
    saveNow();
    closeModal(true);
    render();
    toast('Day saved.');
    return;
  }
  if (name === 'settings') {
    const s = state.settings;
    s.name = String(fd.get('name') || '').trim().slice(0, 40);
    const wt = String(fd.get('wakeTarget') || '');
    if (isTime(wt)) s.wakeTarget = wt;
    const sn = Number(fd.get('sleepNeed'));
    if ([6,6.5,7,7.5,8,8.5,9].indexOf(sn) >= 0) s.sleepNeed = sn;
    s.gymTarget = clamp(Number(fd.get('gymTarget')) || s.gymTarget, 1, 7);
    s.lectureTarget = clamp(Number(fd.get('lectureTarget')) || s.lectureTarget, 10, 100);
    s.tolerance = clamp(Number(fd.get('tolerance')) || 0, 0, 120);
    save(); render();
    toast('Targets saved.');
    return;
  }
  if (name === 'reward') {
    const title = String(fd.get('title') || '').trim();
    if (!title) { toast('Give the reward a name.', 'error'); return; }
    state.rewards.push({
      id: uid(), title: title.slice(0, 70),
      note: String(fd.get('note') || '').trim().slice(0, 140),
      need: clamp(Number(fd.get('need')) || 70, 0, 100),
      createdAt: Date.now()
    });
    save();
    closeModal(true);
    render();
    toast('Added to the shelf.');
    return;
  }
}

/* ============================================================
   Render + router + tick
   ============================================================ */
function signature(){
  const p = promptFor();
  return [currentRoute, logicalToday(), p.kind, p.block ? p.block.id : '', weekOffset, planOverride ? 1 : 0, state.settings.theme].join('|');
}
function render(){
  const focused = document.activeElement;
  let fid = null, selA = null, selB = null;
  if (focused && focused.id && $('#view').contains(focused)) {
    fid = focused.id;
    try { selA = focused.selectionStart; selB = focused.selectionEnd; } catch (e) {}
  }
  $('#view').innerHTML = routeHTML();
  updateNav();
  applyTheme();
  document.documentElement.dataset.part = daypart();
  lastSig = signature();
  lastRenderMin = nowMin();
  if (fid) {
    const el = document.getElementById(fid);
    if (el) {
      try {
        el.focus({ preventScroll: true });
        if (selA != null && el.setSelectionRange) el.setSelectionRange(selA, selB);
      } catch (e) {}
    }
  }
}
function parseRoute(){
  const h = (location.hash || '').replace(/^#\/?/, '').split('?')[0].split('/')[0];
  return ROUTES.some(r => r.id === h) ? h : 'today';
}
function route(scroll){
  const r = parseRoute();
  if (r !== currentRoute) planOverride = false;
  currentRoute = r;
  render();
  if (scroll !== false) window.scrollTo(0, 0);
}
function tick(){
  const nm = nowMin();
  const part = daypart();
  if (document.documentElement.dataset.part !== part) document.documentElement.dataset.part = part;
  if (currentRoute === 'today') {
    const dw = $('#dialWrap');
    if (dw) {
      const dk = logicalToday();
      const tmp = document.createElement('div');
      tmp.innerHTML = dialHTML(dk, peekDay(dk));
      if (tmp.firstChild) dw.replaceWith(tmp.firstChild);
    }
    const p = promptFor();
    const cd = $('#cd');
    if (cd && p.kind === 'active' && p.block) cd.textContent = fmtDur(toMin(p.block.end) - nm) + ' left';
    const bar = $('#activeBar');
    if (bar && p.kind === 'active' && p.block) {
      const s = toMin(p.block.start), e = toMin(p.block.end);
      bar.style.width = clamp((nm - s) / Math.max(1, e - s) * 100, 0, 100).toFixed(1) + '%';
    }
    const nt = $('#tlNowTime');
    if (nt) nt.textContent = 'Now · ' + fmtClock(fromMin(nm));
  }
  if (signature() !== lastSig) { render(); return; }
  const tag = ((document.activeElement || {}).tagName || '');
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag);
  if (nm !== lastRenderMin && nm % 5 === 0 && !typing && !modalOpen()) render();
}

/* ============================================================
   Events + boot
   ============================================================ */
function onDocClick(e){
  const close = e.target.closest('[data-close]');
  if (close) { e.preventDefault(); closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  e.preventDefault();
  handleAct(el.dataset.act, el);
}
function onDocSubmit(e){
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  handleForm(f.dataset.form, new FormData(f), f);
}
function onDocChange(e){
  const t = e.target;
  if (t && t.matches && t.matches('[data-theme-set]')) {
    state.settings.theme = t.dataset.themeSet;
    save(); applyTheme();
    return;
  }
}
function onDocInput(e){
  if (e.target && e.target.matches && e.target.matches('[data-range]')) {
    const out = $('#needOut');
    if (out) out.textContent = e.target.value;
  }
}
function onKey(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = ((document.activeElement || {}).tagName || '');
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
  if (modalOpen()) return;
  const k = String(e.key || '').toLowerCase();
  if (k === 't') { location.hash = '#/today'; }
  else if (k === 'w') { location.hash = '#/week'; }
  else if (k === 'r') { location.hash = '#/rewards'; }
  else if (k === 'n') { e.preventDefault(); openBlockModal(null); }
}
function init(){
  load();
  applyTheme();
  const themeBtn = $('#themeBtn');
  if (themeBtn) themeBtn.addEventListener('click', function(){
    const dark = document.documentElement.dataset.theme === 'dark';
    state.settings.theme = dark ? 'light' : 'dark';
    save(); applyTheme(); render();
  });
  window.addEventListener('hashchange', function(){ route(); });
  document.addEventListener('click', onDocClick);
  document.addEventListener('submit', onDocSubmit);
  document.addEventListener('change', onDocChange);
  document.addEventListener('input', onDocInput);
  document.addEventListener('keydown', onKey);
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') saveNow(); });
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const fn = function(){ if (state.settings.theme === 'auto') { applyTheme(); render(); } };
    if (mq.addEventListener) mq.addEventListener('change', fn);
    else if (mq.addListener) mq.addListener(fn);
  }
  if (!location.hash) { try { location.replace('#/today'); } catch (e) { location.hash = '#/today'; } }
  route(false);
  setInterval(tick, 10000);
  window.__cadence = {
    state: function(){ return state; },
    render: render,
    save: saveNow,
    setNow: function(ms){ window.__cadenceNow = ms; render(); },
    clearNow: function(){ try { delete window.__cadenceNow; } catch (e) { window.__cadenceNow = undefined; } render(); }
  };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
</script>
