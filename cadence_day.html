<!DOCTYPE html>
<html lang="en" data-theme="light" data-part="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence — a week in motion</title>
<meta name="description" content="A calm daily timeline and weekly tracker for sleep, gym, lectures and the goals in between. Private, offline, on your device.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F3ED">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231B1916'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23F0A85A' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='7' r='2.6' fill='%23F0A85A'/%3E%3C/svg%3E">
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --bg:#F6F3ED; --bg-2:#EFEAE1; --paper:#FFFCF7; --paper-2:#FBF7EF;
  --ink:#1B1916; --ink-2:#49433A; --muted:#6B6253; --faint:#70675A;
  --line:#E4DCCC; --line-2:#D2C7B4;
  --sun:#C87322; --sun-ink:#96520F; --sun-soft:#FAEBD8; --sun-line:#EDD3B2;
  --teal:#2A7666; --teal-soft:#E2F0EB; --teal-line:#C4E0D7;
  --clay:#AE4E39; --clay-soft:#F8E5DF; --clay-line:#EFCEC4;
  --violet:#65538A; --violet-soft:#EDE8F6; --violet-line:#DCD2EE;
  --blue:#33658F; --blue-soft:#E4EDF4; --blue-line:#CADCE9;
  --rose:#A05168; --rose-soft:#F7E7EC; --rose-line:#EFD0D9;
  --slate:#56666E; --slate-soft:#E8EEF0; --slate-line:#D3DFE3;
  --glass:rgba(255,252,247,.86);
  --shadow:0 1px 2px rgba(27,25,22,.05), 0 10px 30px -12px rgba(27,25,22,.18);
  --shadow-sm:0 1px 2px rgba(27,25,22,.06);
  --r:16px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --hero-a:#FBE9D2; --hero-b:#FAF5EB;
}
html[data-theme="dark"]{
  --bg:#0E1113; --bg-2:#13171A; --paper:#171C20; --paper-2:#1B2126;
  --ink:#F2EEE6; --ink-2:#CFC8BC; --muted:#98A0A5; --faint:#8C9499;
  --line:#242C31; --line-2:#333D44;
  --sun:#F0AC63; --sun-ink:#F6C391; --sun-soft:#2B2118; --sun-line:#43321F;
  --teal:#74C6AF; --teal-soft:#14241F; --teal-line:#1E3A32;
  --clay:#E28C74; --clay-soft:#2A1C18; --clay-line:#432A23;
  --violet:#B4A2DA; --violet-soft:#1F1E2C; --violet-line:#332F47;
  --blue:#8CB8D9; --blue-soft:#15222C; --blue-line:#243745;
  --rose:#DCA2B4; --rose-soft:#2A1C22; --rose-line:#422A33;
  --slate:#A2B3BB; --slate-soft:#19232A; --slate-line:#2A3A42;
  --glass:rgba(23,28,32,.88);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px -16px rgba(0,0,0,.7);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
}
html[data-part="dawn"]{--hero-a:#FBE7CA;--hero-b:#FBF6EC}
html[data-part="day"]{--hero-a:#EAF1F2;--hero-b:#FAF6EE}
html[data-part="gold"]{--hero-a:#FBE2C0;--hero-b:#FAF3E7}
html[data-part="dusk"]{--hero-a:#EDE4E9;--hero-b:#F7F1E9}
html[data-part="night"]{--hero-a:#E3E7F1;--hero-b:#F4F1EA}
html[data-theme="dark"][data-part="dawn"]{--hero-a:#2A2018;--hero-b:#161A1D}
html[data-theme="dark"][data-part="day"]{--hero-a:#172024;--hero-b:#151A1D}
html[data-theme="dark"][data-part="gold"]{--hero-a:#2B2117;--hero-b:#171A1C}
html[data-theme="dark"][data-part="dusk"]{--hero-a:#221D26;--hero-b:#16191C}
html[data-theme="dark"][data-part="night"]{--hero-a:#171C29;--hero-b:#141719}

/* ============================================================
   Base
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.012em;line-height:1.15}
h1{font-size:clamp(26px,4.4vw,34px)}
h2{font-size:clamp(21px,3vw,26px)}
h3{font-size:16px}
a{color:inherit}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:6px}
::selection{background:var(--sun-soft);color:var(--ink)}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}
.ic.lg{width:22px;height:22px}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;text-decoration:none;transition:top .15s}
.skip:focus{top:12px}
.wrap{width:min(1080px,100% - 32px);margin:0 auto}
@media(max-width:420px){.wrap{width:calc(100% - 24px)}}

/* ============================================================
   Topbar + nav
   ============================================================ */
.topbar{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.mark{width:32px;height:32px;border-radius:9px;background:#1B1916;display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.brandtxt{display:flex;flex-direction:column;line-height:1.1}
.brandtxt b{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.01em}
.brandtxt i{font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:lowercase}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.tabbar{display:flex;align-items:center;gap:2px}
.tab-link{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:99px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;transition:background .13s,color .13s}
.tab-link:hover{background:var(--bg-2);color:var(--ink)}
.tab-link[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tab-link .ic{width:16px;height:16px}
@media(min-width:861px){.tabbar{margin-left:8px}}
@media(max-width:860px){
  .topbar{background:var(--paper);backdrop-filter:none;-webkit-backdrop-filter:none}
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(4,1fr);gap:0;
    padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:var(--glass);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  }
  .tab-link{flex-direction:column;gap:3px;padding:6px 2px;border-radius:10px;font-size:10.5px;font-weight:550;color:var(--muted)}
  .tab-link .ic{width:20px;height:20px}
  .tab-link[aria-current="page"]{background:none;color:var(--sun-ink)}
  .tab-link[aria-current="page"] .ic{stroke-width:2.1}
  .topbar-in{height:56px}
  .page{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
}

/* ============================================================
   Buttons / chips / fields
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:38px;padding:0 15px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--paper);color:var(--ink);font-size:13.5px;font-weight:550;
  cursor:pointer;white-space:nowrap;transition:transform .08s,background .13s,border-color .13s,box-shadow .13s;
  box-shadow:var(--shadow-sm);
}
.btn:hover{background:var(--paper-2);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:0 2px 10px -2px rgba(27,25,22,.4)}
html[data-theme="dark"] .btn.primary{background:var(--sun);border-color:var(--sun);color:#1B1409;box-shadow:0 2px 12px -2px rgba(240,172,99,.3)}
.btn.primary:hover{opacity:.92}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--bg-2);color:var(--ink)}
.btn.danger{background:var(--clay);border-color:var(--clay);color:#fff}
html[data-theme="dark"] .btn.danger{color:#1a0f0b}
.btn.sm{height:31px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn.lg{height:44px;padding:0 20px;font-size:14.5px;border-radius:11px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{
  width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid transparent;
  border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;flex:none;
  transition:background .13s,color .13s;
}
.icon-btn:hover{background:var(--bg-2);color:var(--ink)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn.danger:hover{background:var(--clay-soft);color:var(--clay)}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:11.5px;font-weight:550;color:var(--ink-2);white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.streak{color:var(--sun-ink);background:var(--sun-soft);border-color:var(--sun-line)}
.chipbtn{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:99px;border:1px dashed var(--line-2);background:transparent;color:var(--muted);font-size:11.5px;cursor:pointer}
.chipbtn:hover{border-color:var(--sun);color:var(--sun-ink);background:var(--sun-soft)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.inp,.sel,.ta{
  width:100%;height:40px;padding:0 11px;border:1px solid var(--line-2);border-radius:9px;
  background:var(--paper);color:var(--ink);font-size:14px;transition:border-color .13s,box-shadow .13s;
}
.inp:hover,.sel:hover,.ta:hover{border-color:var(--faint)}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-soft)}
.ta{height:auto;min-height:74px;padding:9px 11px;resize:vertical;line-height:1.5}
input[type="time"].inp{padding-right:6px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.inp::placeholder,.ta::placeholder{color:var(--faint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ============================================================
   Page / panels
   ============================================================ */
.page{display:grid;gap:16px;padding:20px 0 96px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:4px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:15px;font-family:var(--font);font-weight:600;letter-spacing:0}
.panel-head .muted{font-size:11.5px;color:var(--muted)}
.panel-body{padding:16px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty .ic{width:22px;height:22px;color:var(--faint)}

/* ============================================================
   Hero + dial
   ============================================================ */
.hero{
  position:relative;border:1px solid var(--line);border-radius:24px;overflow:hidden;
  background:linear-gradient(140deg,var(--hero-a) 0%,var(--hero-b) 62%);padding:20px 22px 22px;
  box-shadow:var(--shadow);transition:background .6s ease;
}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 88% -10%,rgba(255,255,255,.5),transparent 60%);opacity:.7}
html[data-theme="dark"] .hero::after{background:radial-gradient(120% 80% at 88% -10%,rgba(255,255,255,.07),transparent 60%);opacity:1}
.hero-head{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hero-head h1{margin-top:3px}
.hero-side{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:196px minmax(0,1fr);gap:22px;align-items:center}
@media(max-width:780px){
  .hero-grid{grid-template-columns:minmax(0,1fr);gap:16px}
  .hero{padding:16px 15px 18px;border-radius:20px}
  .hero-head{margin-bottom:10px}
  .hero-side{width:100%}
}
.dial-wrap{position:relative;width:196px;height:196px;justify-self:center;flex:none}
@media(max-width:780px){.dial-wrap{width:168px;height:168px}}
.dial{width:100%;height:100%;display:block;overflow:visible}
.dial-track{fill:none;stroke:var(--line-2);stroke-width:1;opacity:.5}
.dial-rim{fill:none;stroke:var(--paper);stroke-width:11;opacity:.75}
.arc-sleep{fill:none;stroke:var(--slate);stroke-width:9;opacity:.22;stroke-linecap:butt}
.arc-block{fill:none;stroke-width:8;stroke-linecap:butt;transition:opacity .3s}
.arc-block.s-done{opacity:1}
.arc-block.s-partial{opacity:.62;stroke-dasharray:3 4}
.arc-block.s-missed{opacity:.28;stroke-dasharray:2 5}
.arc-block.s-planned{opacity:.55}
.arc-block.s-skipped{opacity:.18;stroke-dasharray:1 5}
.k-focus{--kc:var(--violet)}
.k-move{--kc:var(--teal)}
.k-meal{--kc:var(--sun)}
.k-rest{--kc:var(--slate)}
.k-other{--kc:var(--blue)}
path.k-focus{stroke:var(--violet)} path.k-move{stroke:var(--teal)}
path.k-meal{stroke:var(--sun)} path.k-rest{stroke:var(--slate)} path.k-other{stroke:var(--blue)}
.dial-tick{stroke:var(--line-2);stroke-width:1}
.dial-lab{fill:var(--faint);font-size:8px;font-family:var(--font);font-weight:600;text-anchor:middle;dominant-baseline:middle}
.dial-hand{stroke:var(--sun);stroke-width:2;stroke-linecap:round;transition:transform 10s linear}
.dial-hand-dot{fill:var(--sun)}
.dial-hub{fill:var(--sun)}
.dial-pt{stroke:var(--paper);stroke-width:1.5}
.dial-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.dial-core b{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.dial-core b i{font-style:normal;font-size:13px;color:var(--muted);margin-left:1px;letter-spacing:0}
.dial-core small{font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.02em}
@media(max-width:780px){.dial-core b{font-size:27px}}

/* ============================================================
   Prompt card
   ============================================================ */
.prompt{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:17px 18px;box-shadow:0 2px 14px -6px rgba(27,25,22,.14)}
.p-kick{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--sun-ink);margin-bottom:7px}
.p-kick .ic{width:14px;height:14px}
.prompt h2{font-size:clamp(20px,3vw,25px)}
.p-sub{color:var(--muted);font-size:12.5px;margin-top:5px;max-width:52ch}
.prompt form{margin-top:13px;display:grid;gap:10px}
.p-meta{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.row-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.pbar{height:5px;border-radius:99px;background:var(--bg-2);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--sun);transition:width .4s}
.timefield{display:flex;align-items:center;gap:8px}
.timefield input{
  flex:1;height:52px;border:1px solid var(--line-2);border-radius:11px;background:var(--bg);
  font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.01em;text-align:center;
  font-variant-numeric:tabular-nums;padding:0 10px;
}
.timefield input:focus{outline:none;border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-soft);background:var(--paper)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.kinds{display:flex;gap:4px;flex-wrap:wrap}
.kinds label{position:relative;display:inline-flex}
.kinds input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
.kinds label span{display:inline-flex;align-items:center;gap:5px;height:29px;padding:0 10px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .13s}
.kinds label span::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--kc);opacity:.55}
.kinds input:checked+span{background:var(--paper-2);border-color:var(--kc);color:var(--ink);box-shadow:inset 0 0 0 1px var(--kc)}
.kinds input:checked+span::before{opacity:1}
.kinds input:focus-visible+span{outline:2px solid var(--sun);outline-offset:2px}
.review-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.rv{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 6px;border-radius:11px;
  border:1px solid var(--line-2);background:var(--paper);font-size:12px;font-weight:550;cursor:pointer;
  transition:transform .08s,border-color .13s,background .13s;
}
.rv:hover{border-color:var(--faint)}
.rv:active{transform:translateY(1px)}
.rv .ic{width:19px;height:19px}
.rv.done{color:var(--teal);border-color:var(--teal-line);background:var(--teal-soft)}
.rv.partial{color:var(--sun-ink);border-color:var(--sun-line);background:var(--sun-soft)}
.rv.missed{color:var(--clay);border-color:var(--clay-line);background:var(--clay-soft)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.moods label{position:relative;display:block}
.moods input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
.moods label span{display:flex;align-items:center;justify-content:center;height:32px;border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--muted);cursor:pointer;text-align:center}
.moods input:checked+span{background:var(--sun-soft);border-color:var(--sun-line);color:var(--sun-ink);font-weight:600}
.moods input:focus-visible+span{outline:2px solid var(--sun);outline-offset:2px}
@media(max-width:420px){.prompt{padding:14px 13px}.review-row{gap:5px}.rv{padding:9px 4px;font-size:11px}}

/* ============================================================
   Timeline
   ============================================================ */
.tl{padding:6px 8px 10px}
.tl-row{display:grid;grid-template-columns:52px 14px minmax(0,1fr) auto;align-items:start;gap:10px;padding:10px 8px;border-radius:10px;position:relative}
@media(max-width:420px){.tl-row{grid-template-columns:46px 10px minmax(0,1fr) auto;gap:8px;padding:10px 4px}}
.tl-row:hover{background:var(--bg-2)}
.tl-row+.tl-row{box-shadow:inset 0 1px 0 var(--line)}
.tl-time{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums;line-height:1.3;padding-top:1px}
.tl-time b{font-size:13px;font-weight:600}
.tl-time span{font-size:10.5px;color:var(--faint)}
.tl-dot{width:9px;height:9px;border-radius:99px;background:var(--kc,var(--line-2));margin:5px auto 0;box-shadow:0 0 0 3px var(--paper);position:relative;z-index:1}
.tl-body{min-width:0}
.tl-title{font-size:13.5px;font-weight:550;letter-spacing:-.005em;overflow-wrap:anywhere}
.tl-meta{font-size:11px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-note{font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44ch;font-style:italic}
.tl-act{display:flex;gap:1px;opacity:.55;transition:opacity .13s}
.tl-row:hover .tl-act,.tl-row:focus-within .tl-act{opacity:1}
@media(hover:none){.tl-act{opacity:.75}}
.tl-now{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 4px;margin:1px 0}
.tl-now::before,.tl-now::after{content:"";height:1px;background:var(--sun);flex:1;opacity:.5}
.tl-now span{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sun-ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-wake .tl-title,.tl-sleep .tl-title{color:var(--ink-2)}
.tl-wake .tl-dot{background:var(--sun)}
.tl-sleep .tl-dot{background:var(--slate)}
.pill{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 6px;border-radius:99px;font-size:10px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill.done{background:var(--teal-soft);color:var(--teal)}
.pill.partial{background:var(--sun-soft);color:var(--sun-ink)}
.pill.missed{background:var(--clay-soft);color:var(--clay)}
.pill.planned{background:var(--bg-2);color:var(--muted)}
.pill.live{background:var(--sun-soft);color:var(--sun-ink)}
.tl-row.s-done .tl-title{color:var(--ink-2)}
.tl-row.s-missed .tl-title{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted)}

/* ============================================================
   Trackers
   ============================================================ */
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:780px){.tracks{grid-template-columns:1fr}}
.track{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.track::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,var(--line-2));opacity:.8}
.track.t-gym{--tc:var(--teal)}
.track.t-lec{--tc:var(--blue)}
.track.t-sleep{--tc:var(--slate)}
.track.on{background:linear-gradient(180deg,var(--teal-soft),var(--paper) 70%)}
.t-head{display:flex;align-items:center;gap:6px;color:var(--muted)}
.t-head .ic{width:15px;height:15px;color:var(--tc)}
.t-head h3{font-family:var(--font);font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t-big{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.t-big span{font-size:14px;color:var(--muted);font-family:var(--font);font-weight:500;margin-left:1px}
.t-sub{font-size:11.5px;color:var(--muted);line-height:1.35;margin-bottom:8px}
.track .btn{align-self:flex-start;margin-top:auto}
.steppers{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.step{display:flex;align-items:center;justify-content:space-between;gap:6px}
.step>span{font-size:11px;color:var(--muted)}
.num{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--bg)}
.num button{width:24px;height:24px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
.num button:hover{background:var(--paper);color:var(--ink)}
.num b{min-width:20px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}

/* ============================================================
   Week
   ============================================================ */
.wk-nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.score-panel{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;padding:20px;align-items:center}
@media(max-width:700px){.score-panel{grid-template-columns:1fr;gap:14px;padding:16px;justify-items:center;text-align:center}}
.ring-wrap{position:relative;width:150px;height:150px;flex:none}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg-2);stroke-width:10}
.ring-fg{fill:none;stroke:var(--sun);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-txt b{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ring-txt b span{font-size:14px;color:var(--muted);font-family:var(--font);font-weight:500;letter-spacing:0}
.ring-txt small{font-size:10px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.score-body{min-width:0}
.score-body h2{margin-top:2px}
.metric-list{display:grid;gap:9px;margin-top:14px}
.metric{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center}
.metric .m-lab{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.metric .m-bar{height:6px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.metric .m-bar i{display:block;height:100%;border-radius:99px;background:var(--mc,var(--sun));transition:width .5s}
.metric .m-val{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:900px){.goals{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.goals{grid-template-columns:1fr}}
.goal{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow-sm)}
.goal .g-head{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.goal .g-head .ic{width:14px;height:14px;color:var(--gc,var(--sun))}
.goal .g-big{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.1}
.goal .g-big small{font-size:12.5px;color:var(--muted);font-family:var(--font);font-weight:500;margin-left:2px}
.goal .g-target{font-size:11px;color:var(--muted);margin-top:2px}
.dots{display:flex;gap:3px;margin-top:9px}
.dots i{width:100%;height:5px;border-radius:99px;background:var(--bg-2)}
.dots i.hit{background:var(--teal)}
.dots i.miss{background:var(--clay);opacity:.55}
.dots i.future{opacity:.5}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:780px){.charts{grid-template-columns:1fr}}
.chart{padding:14px 16px 12px}
.chart h3{font-family:var(--font);font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.plot{position:relative;height:70px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 6px 0 0}
.plot .band{position:absolute;top:6px;bottom:6px;background:var(--teal-soft);border-left:1px dashed var(--teal-line);border-right:1px dashed var(--teal-line);opacity:.9}
.plot .pt{position:absolute;width:9px;height:9px;border-radius:99px;background:var(--sun);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--sun-line);transform:translate(-50%,50%)}
.plot .pt.hit{background:var(--teal)}
.plot .pt.miss{background:var(--clay)}
.plot .pt.none{background:var(--line-2)}
.plot .tline{position:absolute;left:0;right:0;border-top:1px dashed var(--faint);opacity:.6}
.axis{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.bars7{display:flex;align-items:flex-end;gap:5px;height:70px;border-bottom:1px solid var(--line);padding-bottom:0}
.bars7 .bar{flex:1;position:relative;height:100%;display:flex;align-items:flex-end}
.bars7 .bar i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--slate);opacity:.35;min-height:2px}
.bars7 .bar.ok i{background:var(--teal);opacity:.85}
.bars7 .bar .need{position:absolute;left:-3px;right:-3px;border-top:1px dashed var(--clay);opacity:.7}
.daylist{display:flex;flex-direction:column}
.dayrow{
  display:grid;grid-template-columns:58px 62px 78px minmax(0,1fr) 62px 14px;gap:8px;align-items:center;
  padding:9px 16px;border:0;border-top:1px solid var(--line);width:100%;
  background:transparent;color:inherit;font:inherit;font-size:12px;text-align:left;cursor:pointer;
  transition:background .12s;
}
.dayrow:hover{background:var(--bg-2)}
.dayrow:focus-visible{outline:2px solid var(--sun);outline-offset:-2px}
.dayrow:first-child{border-top:0}
.dayrow.today{background:var(--sun-soft)}
.dayrow .d-go{width:14px;height:14px;color:var(--faint);opacity:0;transition:opacity .12s;justify-self:end}
.dayrow:hover .d-go,.dayrow:focus-visible .d-go{opacity:1}
@media(hover:none){.dayrow .d-go{opacity:.5}}
.dayrow .d-name{display:flex;align-items:baseline;gap:5px;font-weight:600}
.dayrow .d-name small{font-weight:500;color:var(--muted);font-size:10.5px}
.dayrow .d-cell{color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayrow .d-cell b{color:var(--ink);font-weight:550}
.dayrow .d-dot{width:7px;height:7px;border-radius:99px;background:var(--line-2);flex:none}
.dayrow .d-dot.on{background:var(--teal)}
@media(max-width:700px){
  .dayrow{grid-template-columns:52px minmax(0,1fr);grid-auto-flow:row;gap:2px 8px;padding:10px 28px 10px 14px;position:relative}
  .dayrow .d-name{grid-row:span 2}
  .dayrow .d-cell{font-size:11.5px;flex-wrap:wrap}
  .dayrow .d-cell.wide{grid-column:2}
  .dayrow .d-hide{display:none}
  .dayrow .d-go{position:absolute;right:10px;top:50%;transform:translateY(-50%);opacity:.6}
}

/* ============================================================
   Day editor
   ============================================================ */
.dm-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:430px){.dm-top{grid-template-columns:1fr}}
.dm-sec{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--bg)}
.dm-sec>h3{font-family:var(--font);font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.dm-sec>h3 .ic{width:14px;height:14px}
.dm-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dm-check{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer}
.dm-check input{width:17px;height:17px;margin:0;flex:none;accent-color:var(--teal)}
.dm-blocks{display:flex;flex-direction:column;gap:5px}
.dm-block{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;
  padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);
  color:inherit;font:inherit;font-size:12.5px;text-align:left;cursor:pointer;transition:border-color .12s,background .12s;
}
.dm-block:hover{border-color:var(--faint);background:var(--paper-2)}
.dm-block:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
.dm-block .dm-t{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dm-block .dm-g{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.dm-empty{font-size:12px;color:var(--muted);padding:2px 0 7px}
.dm-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.wk-note{font-size:11.5px;color:var(--muted);margin-top:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wk-note .ic{width:14px;height:14px;flex:none;color:var(--faint)}
.hint{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--line-2);border-radius:11px;background:var(--bg);margin-bottom:13px;font-size:12px;line-height:1.5;color:var(--ink-2)}
.hint>.ic{width:15px;height:15px;flex:none;margin-top:2px;color:var(--sun-ink)}
.hint b{color:var(--ink);font-weight:600}
.hint .hint-x{margin-left:auto;flex:none;align-self:center}
.day-quote{padding:9px 16px 1px;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-2);line-height:1.5}
.p-done .day-quote{padding:8px 0 0;font-size:13.5px;max-width:46ch}

/* ============================================================
   Rewards
   ============================================================ */
.rwd-strip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(120deg,var(--sun-soft),var(--paper) 65%)}
.rwd-strip .big{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.rwd-strip .txt{font-size:12px;color:var(--muted)}
.rwd-strip .spacer{margin-left:auto}
.rwds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rwd{border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:var(--paper);display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.rwd.unlocked{border-color:var(--sun-line);background:linear-gradient(170deg,var(--sun-soft),var(--paper) 55%)}
.rwd.claimed{border-color:var(--teal-line);background:linear-gradient(170deg,var(--teal-soft),var(--paper) 55%)}
.rwd-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rwd h3{font-family:var(--serif);font-size:16.5px;line-height:1.25}
.rwd .need{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:99px;background:var(--bg-2);color:var(--muted);font-variant-numeric:tabular-nums}
.rwd.unlocked .need{background:var(--sun);color:#241503}
.rwd.claimed .need{background:var(--teal);color:#fff}
.rwd p{font-size:12px;color:var(--muted);line-height:1.45}
.rwd-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.rwd-state{font-size:11px;color:var(--muted);flex:1;min-width:90px}
.rwd .icon-btn{position:absolute;top:8px;right:8px;opacity:0}
.rwd:hover .icon-btn,.rwd:focus-within .icon-btn{opacity:1}
@media(hover:none){.rwd .icon-btn{opacity:.7}}
.ideas{display:flex;gap:6px;flex-wrap:wrap}
.idea{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;border:1px dashed var(--line-2);background:transparent;font-size:11.5px;color:var(--muted);cursor:pointer}
.idea:hover{border-color:var(--sun);background:var(--sun-soft);color:var(--sun-ink)}
.hist{display:flex;flex-direction:column}
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px}
.hist-row:first-child{border-top:0}
.hist-row .h-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);flex:none}
.hist-row .h-ic .ic{width:14px;height:14px}
.hist-row .h-main{min-width:0;flex:1}
.hist-row .h-main b{display:block;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-row .h-main span{font-size:11px;color:var(--muted)}
.hist-row .h-score{font-variant-numeric:tabular-nums;color:var(--teal);font-weight:600;font-size:12px}

/* ============================================================
   Settings
   ============================================================ */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.set-grid{grid-template-columns:1fr}}
.set-section{padding:16px}
.set-section>.set-grid+.set-grid{margin-top:12px}
.set-note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:3px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);gap:2px}
.seg label{position:relative;display:inline-flex}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
.seg label span{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:7px;font-size:12px;color:var(--muted);cursor:pointer}
.seg input:checked+span{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sm);font-weight:550}
.seg input:focus-visible+span{outline:2px solid var(--sun);outline-offset:2px}
.data-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.data-row:first-of-type{border-top:0}
.data-row .dr-txt{flex:1;min-width:160px}
.data-row .dr-txt b{display:block;font-size:13px;font-weight:550}
.data-row .dr-txt span{font-size:11.5px;color:var(--muted)}
.file-note{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:12px;line-height:1.45;color:var(--muted);margin-top:10px}
.file-note .ic{width:15px;height:15px;flex:none;margin-top:1px;color:var(--teal)}
.file-note b{color:var(--ink);font-weight:550}
.file-note.error{border-color:var(--clay-line);background:var(--clay-soft);color:var(--clay)}
.file-note.error .ic{color:var(--clay)}
.dropbox{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px dashed var(--line-2);border-radius:10px;background:var(--bg);cursor:pointer;transition:border-color .13s,background .13s;margin-top:10px}
.dropbox:hover,.dropbox.over{border-color:var(--sun);background:var(--sun-soft)}
.dropbox .ic{color:var(--muted)}
.dropbox b{font-size:12.5px;font-weight:550;display:block}
.dropbox small{font-size:11px;color:var(--muted)}
.file-input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;opacity:0}

/* ============================================================
   Modal / toast
   ============================================================ */
#modalRoot{position:fixed;inset:0;z-index:90;display:none}
#modalRoot.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(20,17,13,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .16s ease}
html[data-theme="dark"] .scrim{background:rgba(0,0,0,.6)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal{
  position:relative;z-index:1;width:min(480px,calc(100% - 24px));max-height:min(86vh,760px);
  margin:7vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;
  animation:pop .18s ease;overflow:hidden;
}
.modal.wide{width:min(560px,calc(100% - 24px))}
@media(max-width:520px){.modal{margin-top:4vh;max-height:92vh}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 12px}
.modal-head h2{font-size:20px}
.modal-head p{font-size:12px;color:var(--muted);margin-top:3px;max-width:42ch}
.modal-body{padding:4px 18px 16px;overflow-y:auto;display:grid;gap:12px}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--paper-2);flex-wrap:wrap}
.modal-foot .left{margin-right:auto}
body.no-scroll{overflow:hidden}
#toastRoot{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:calc(100% - 24px)}
@media(max-width:860px){#toastRoot{bottom:calc(78px + env(safe-area-inset-bottom))}}
.toast{
  background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;padding:9px 14px;border-radius:99px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.45);animation:pop .18s ease;transition:opacity .25s,transform .25s;
  text-align:center;
}
.toast.error{background:var(--clay);color:#fff}
html[data-theme="dark"] .toast{background:var(--sun);color:#1B1409}
html[data-theme="dark"] .toast.error{background:var(--clay);color:#1a0f0b}
.toast.out{opacity:0;transform:translateY(6px)}
.no-anim *{transition:none !important;animation:none !important}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<header class="topbar">
  <div class="wrap topbar-in">

<script>
(function(){
'use strict';

/* ============================================================
   Constants & helpers
   ============================================================ */
const KEY = 'cadence.day.v1';
const KEY_BAK = KEY + '.bak';
const KEY_META = KEY + '.meta';
const DAY_START = 4;            // a day runs 04:00 → 03:59
const KINDS = ['focus','move','meal','rest','other'];
const KIND_LABEL = {focus:'Focus', move:'Body', meal:'Meal', rest:'Rest', other:'Other'};
const STATUSES = ['planned','done','partial','missed','skipped'];
const ROUTES = [
  {id:'today', label:'Today', icon:'sun'},
  {id:'week', label:'Week', icon:'target'},
  {id:'rewards', label:'Rewards', icon:'gift'},
  {id:'settings', label:'Settings', icon:'settings'}
];

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
function icon(name, cls){ return '<svg class="ic'+(cls?' '+cls:'')+'" aria-hidden="true" focusable="false"><use href="#i-'+name+'"></use></svg>'; }

const pad = n => String(n).padStart(2, '0');
function nowMs(){ const o = window.__cadenceNow; return typeof o === 'number' && isFinite(o) ? o : Date.now(); }
function dt(ms){ return new Date(ms == null ? nowMs() : ms); }
function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseKey(k){ const p = String(k).split('-').map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); }
function addDays(k, n){ const d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); }
function diffDays(a, b){ return Math.round((parseKey(b) - parseKey(a)) / 86400000); }
function weekStartOf(k){ const d = parseKey(k); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return dateKey(d); }
function weekDays(start){ const out = []; for (let i = 0; i < 7; i++) out.push(addDays(start, i)); return out; }
function logicalToday(){ const d = dt(); if (d.getHours() < DAY_START) d.setDate(d.getDate() - 1); return dateKey(d); }
function isTime(t){ return typeof t === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(t); }
function toMin(t){ if (!isTime(t)) return null; const p = t.split(':').map(Number); return p[0]*60 + p[1]; }
function fromMin(m){ m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m % 60); }
function nowMinFloat(){ const d = dt(); return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; }
function nowMin(){ return Math.floor(nowMinFloat()); }
function circDiff(a, b){ const d = Math.abs(a - b) % 1440; return Math.min(d, 1440 - d); }
function durBetween(sleep, wake){
  const a = toMin(sleep), b = toMin(wake);
  if (a == null || b == null) return null;
  let d = b - a; if (d < 0) d += 1440; return d;
}
function fmtClock(t){
  const m = toMin(t); if (m == null) return '—';
  let h = Math.floor(m/60), mm = m % 60; const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + pad(mm) + ' ' + ap;
}
function fmtShort(t){
  const m = toMin(t); if (m == null) return '—';
  let h = Math.floor(m/60), mm = m % 60; h = h % 12; if (h === 0) h = 12;
  return h + ':' + pad(mm);
}
function fmtDur(mins){
  if (mins == null || !isFinite(mins)) return '—';
  mins = Math.round(mins);
  const h = Math.floor(mins/60), m = mins % 60;
  if (h <= 0) return m + 'm';
  return h + 'h' + (m ? ' ' + m + 'm' : '');
}
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDate(k, opts){
  opts = opts || {};
  const d = parseKey(k);
  if (opts.long) return DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  return DOW3[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0,3);
}
function rangeLabel(start){
  const a = parseKey(start), b = parseKey(addDays(start, 6));
  if (a.getMonth() === b.getMonth()) return a.getDate() + '–' + b.getDate() + ' ' + MONTHS[a.getMonth()] + ' ' + a.getFullYear();
  return a.getDate() + ' ' + MONTHS[a.getMonth()].slice(0,3) + ' – ' + b.getDate() + ' ' + MONTHS[b.getMonth()].slice(0,3) + ' ' + b.getFullYear();
}
function daypart(){
  const d = dt(), h = d.getHours() + d.getMinutes()/60;
  if (h >= 5 && h < 8.5) return 'dawn';
  if (h >= 8.5 && h < 16) return 'day';
  if (h >= 16 && h < 19.5) return 'gold';
  if (h >= 19.5 && h < 23) return 'dusk';
  return 'night';
}
function greeting(){
  const h = dt().getHours();
  if (h < 5) return 'Still up';
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  if (h < 22) return 'Good evening';
  return 'Winding down';
}

/* ============================================================
   State
   ============================================================ */
let state = blank();
let currentRoute = 'today';
let weekOffset = 0;
let planOverride = false;
let blockReturn = null;
let lastSig = '';
let lastRenderMin = -1;
let saveTimer = null;
let toastId = 0;

function blankSettings(){
  return { name:'', theme:'auto', wakeTarget:'07:00', sleepNeed:7.5, gymTarget:3, lectureTarget:85, tolerance:30, seenIntro:false };
}
function blankDay(k){
  return { date:k, wake:null, sleep:null, prevSleepAsked:false, blocks:[], gym:false,
           lectures:{attended:0, scheduled:0}, mood:null, note:'', closed:false };
}
function seedRewards(){
  const now = Date.now();
  return [
    {id:uid(), title:'A slow morning, no alarm', note:'Let the day start without you.', need:55, createdAt:now},
    {id:uid(), title:'Takeout from your favourite place', note:'No cooking, no dishes.', need:70, createdAt:now},
    {id:uid(), title:'A day with nothing planned', note:'That is the whole point of the week.', need:85, createdAt:now}
  ];
}
function blank(){
  return { version:1, settings:blankSettings(), days:{}, rewards:seedRewards(), claimed:[], created:Date.now() };
}
function normalize(raw){
  const s = blank();
  if (!raw || typeof raw !== 'object') return s;
  const st = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
  s.settings = {
    name: String(st.name || '').slice(0, 40),
    theme: ['auto','light','dark'].indexOf(st.theme) >= 0 ? st.theme : 'auto',
    wakeTarget: isTime(st.wakeTarget) ? st.wakeTarget : '07:00',
    sleepNeed: [6,6.5,7,7.5,8,8.5,9].indexOf(Number(st.sleepNeed)) >= 0 ? Number(st.sleepNeed) : 7.5,
    gymTarget: clamp(Number(st.gymTarget) || 3, 1, 7),
    lectureTarget: clamp(Number(st.lectureTarget) || 85, 10, 100),
    tolerance: [0,15,30,45,60].indexOf(Number(st.tolerance)) >= 0 ? Number(st.tolerance) : 30,
    seenIntro: !!st.seenIntro
  };
  const days = raw.days && typeof raw.days === 'object' ? raw.days : {};
  Object.keys(days).forEach(k => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    const d = days[k]; if (!d || typeof d !== 'object') return;
    const blocks = Array.isArray(d.blocks) ? d.blocks.filter(b => b && typeof b === 'object').map(b => ({
      id: typeof b.id === 'string' && b.id ? b.id : uid(),
      start: isTime(b.start) ? b.start : '09:00',
      end: isTime(b.end) ? b.end : '10:00',
      goal: String(b.goal || 'Untitled').slice(0, 90),
      kind: KINDS.indexOf(b.kind) >= 0 ? b.kind : 'focus',
      status: STATUSES.indexOf(b.status) >= 0 ? b.status : 'planned',
      note: String(b.note || '').slice(0, 280),
      doneAt: Number(b.doneAt) || null
    })).slice(0, 60) : [];
    const lec = d.lectures && typeof d.lectures === 'object' ? d.lectures : {};
    const scheduled = clamp(Number(lec.scheduled) || 0, 0, 20);
    s.days[k] = {
      date: k,
      wake: isTime(d.wake) ? d.wake : null,
      sleep: isTime(d.sleep) ? d.sleep : null,
      prevSleepAsked: !!d.prevSleepAsked,
      blocks: blocks,
      gym: !!d.gym,
      lectures: { scheduled: scheduled, attended: clamp(Number(lec.attended) || 0, 0, scheduled) },
      mood: [1,2,3,4,5].indexOf(Number(d.mood)) >= 0 ? Number(d.mood) : null,
      note: String(d.note || '').slice(0, 400),
      closed: !!d.closed
    };
  });
  if (Array.isArray(raw.rewards)) {
    s.rewards = raw.rewards.filter(r => r && typeof r === 'object' && r.title).map(r => ({
      id: typeof r.id === 'string' && r.id ? r.id : uid(),
      title: String(r.title).slice(0, 70),
      note: String(r.note || '').slice(0, 140),
      need: clamp(Number(r.need) || 70, 0, 100),
      createdAt: Number(r.createdAt) || Date.now()
    })).slice(0, 40);
  }
  if (Array.isArray(raw.claimed)) {
    s.claimed = raw.claimed.filter(c => c && c.week && c.title).map(c => ({
      id: typeof c.id === 'string' && c.id ? c.id : uid(),
      week: String(c.week).slice(0, 10),
      rewardId: String(c.rewardId || ''),
      title: String(c.title).slice(0, 70),
      at: Number(c.at) || Date.now(),
      score: clamp(Number(c.score) || 0, 0, 100)
    })).slice(0, 200);
  }
  s.created = Number(raw.created) || Date.now();
  return s;
}
function mergeStates(base, inc){
  let days = 0, filled = 0, rewards = 0, claims = 0;
  Object.keys(inc.days).forEach(function(k){
    const local = base.days[k];
    if (!local) { base.days[k] = inc.days[k]; days++; }
    else if (!local.wake && inc.days[k].wake) { base.days[k] = inc.days[k]; filled++; }
  });
  inc.rewards.forEach(function(r){
    if (!base.rewards.some(function(x){ return x.title.toLowerCase() === r.title.toLowerCase(); })) {
      base.rewards.push(r); rewards++;
    }
  });
  inc.claimed.forEach(function(c){
    if (!base.claimed.some(function(x){ return x.week === c.week; })) { base.claimed.push(c); claims++; }
  });
  return { days: days + filled, rewards: rewards, claims: claims };
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (!raw) { state = blank(); saveNow(); return; }
  try { state = normalize(JSON.parse(raw)); return; }
  catch (e) {
    // The main copy is unreadable. Try the rolling backup before giving up.
    let bak = null;
    try { bak = localStorage.getItem(KEY_BAK); } catch (e2) {}
    if (bak) {
      try {
        state = normalize(JSON.parse(bak));
        saveNow();
        toast('Saved data was unreadable — restored the last good copy.', 'error');
        return;
      } catch (e3) {}
    }
    state = blank();
    toast('Saved data was unreadable and the backup failed too. Starting fresh.', 'error');
  }
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 220); }
function saveNow(){
  clearTimeout(saveTimer);
  try {
    const json = JSON.stringify(state);
    localStorage.setItem(KEY, json);
    localStorage.setItem(KEY_BAK, json);
    localStorage.setItem(KEY_META, String(Date.now()));
  }
  catch (e) { toast('Could not save — browser storage may be full.', 'error'); }
}
function lastSaved(){
  try { return Number(localStorage.getItem(KEY_META)) || 0; } catch (e) { return 0; }
}
function agoLabel(ms){
  const secs = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (secs < 90) return 'just now';
  const mins = Math.round(secs / 60);
  if (mins < 60) return mins + ' min ago';
  const hours = Math.round(mins / 60);
  if (hours < 24) return hours + (hours === 1 ? ' hour ago' : ' hours ago');
  const d = dt(ms);
  return fmtDate(dateKey(d)) + ' at ' + fmtClock(fromMin(d.getHours()*60 + d.getMinutes()));
}
function peekDay(k){ return state.days[k] || null; }
function ensureDay(k){ if (!state.days[k]) state.days[k] = blankDay(k); return state.days[k]; }

/* ============================================================
   Week maths
   ============================================================ */
function weekStats(start){
  const keys = weekDays(start);
  const today = logicalToday();
  const curStart = weekStartOf(today);
  const s = {
    start: start, keys: keys, isCurrent: start === curStart,
    activeDays: 0, wakeLogged: 0, wakeOn: 0, wakeSum: 0,
    sleepLogged: 0, sleepOn: 0, sleepSum: 0,
    gym: 0, att: 0, sched: 0, rows: [],
    blocksDue: 0, blocksKept: 0, bestNight: null
  };
  const tol = state.settings.tolerance;
  keys.forEach(k => {
    const d = peekDay(k);
    const counts = k < today || (k === today && !!(d && d.wake));
    if (counts) s.activeDays++;
    if (d && counts) {
      if (d.wake) {
        s.wakeLogged++; s.wakeSum += toMin(d.wake);
        if (circDiff(toMin(d.wake), toMin(state.settings.wakeTarget)) <= tol) s.wakeOn++;
      }
      const prev = peekDay(addDays(k, -1));
      if (d.wake && prev && prev.sleep) {
        const dur = durBetween(prev.sleep, d.wake);
        if (dur != null) {
          s.sleepLogged++; s.sleepSum += dur; if (dur >= state.settings.sleepNeed * 60) s.sleepOn++;
          if (!s.bestNight || dur > s.bestNight.dur) s.bestNight = { key:k, dur:dur };
        }
      }
      if (d.gym) s.gym++;
      if (d.lectures.scheduled > 0) { s.att += d.lectures.attended; s.sched += d.lectures.scheduled; }
      // Follow-through: blocks whose window has closed, minus ones you deliberately skipped.
      d.blocks.forEach(b => {
        const ended = k < today || (k === today && nowMin() >= toMin(b.end));
        if (!ended || b.status === 'skipped') return;
        s.blocksDue++;
        if (b.status === 'done') s.blocksKept += 1;
        else if (b.status === 'partial') s.blocksKept += 0.5;
      });
    }
    s.rows.push({ key:k, day:d, counts:counts, future: k > today });
  });
  s.wakeScore = s.activeDays ? s.wakeOn / s.activeDays : null;
  s.sleepScore = s.activeDays ? s.sleepOn / s.activeDays : null;
  s.gymScore = s.activeDays ? clamp(s.gym / state.settings.gymTarget, 0, 1) : null;
  s.lecPct = s.sched ? (s.att / s.sched) * 100 : null;
  s.lecScore = s.lecPct == null ? null : clamp(s.lecPct / state.settings.lectureTarget, 0, 1);
  s.wakeAvg = s.wakeLogged ? s.wakeSum / s.wakeLogged : null;
  s.sleepAvg = s.sleepLogged ? s.sleepSum / s.sleepLogged : null;
  s.blocksScore = s.blocksDue ? s.blocksKept / s.blocksDue : null;
  const parts = [s.wakeScore, s.sleepScore, s.gymScore, s.lecScore].filter(v => v != null);
  s.hasData = !!(s.wakeLogged || s.sleepLogged || s.gym || s.sched);
  s.score = parts.length && s.hasData ? Math.round(100 * parts.reduce((a,b) => a+b, 0) / parts.length) : null;

}
function tierOf(score){
  if (score == null) return {name:'Not started', key:'none'};
  if (score >= 85) return {name:'Excellent', key:'gold'};
  if (score >= 70) return {name:'Strong', key:'good'};

}

}
function wakeStreak(dk){
  let n = 0, k = dk;
  const todayWake = peekDay(dk);
  if (!(todayWake && todayWake.wake)) k = addDays(dk, -1);
  for (let i = 0; i < 400; i++) {
    const d = peekDay(k);
    if (d && d.wake) { n++; k = addDays(k, -1); } else break;
  }
  return n;
}
function claimForWeek(start){ return state.claimed.find(c => c.week === start) || null; }
function currentClaim(){ return claimForWeek(weekStartOf(logicalToday())); }
/* ============================================================
   Prompt resolution
   ============================================================ */
function promptFor(){
  const dk = logicalToday();
  const day = peekDay(dk);
  const nm = nowMin();
  if (!day || !day.wake) return {kind:'wake'};
  const prev = peekDay(addDays(dk, -1));
  if (!day.prevSleepAsked && !(prev && prev.sleep)) return {kind:'sleepPrev'};
  const pending = day.blocks.filter(b => b.status === 'planned').sort((a,b) => toMin(a.start) - toMin(b.start));
  const due = pending.filter(b => nm >= toMin(b.end));
  if (due.length) return {kind:'review', block: due[0]};
  const active = pending.find(b => nm >= toMin(b.start) && nm < toMin(b.end));
  if (active) return {kind:'active', block: active};
  const next = pending.find(b => nm < toMin(b.start));
  if (next) return {kind:'upcoming', block: next};
  if (day.sleep) return {kind:'done'};
  if (!planOverride && nm >= 20*60 + 30) return {kind:'winddown'};
  return {kind:'plan'};
}
function lastPendingEnd(dk){
  const day = peekDay(dk);
  if (!day) return null;
  const ends = day.blocks.filter(b => b.status === 'planned').map(b => toMin(b.end));
  return ends.length ? Math.max.apply(null, ends) : null;
}
function suggestWindow(dk){
  const nm = dk === logicalToday() ? nowMin() : 9 * 60;
  let start = Math.ceil((nm + 5) / 15) * 15;
  const last = lastPendingEnd(dk);
  if (last != null && last > start && last < 23*60) start = Math.ceil(last/15)*15;
  if (start >= 23*60 + 45) start = 23*60 + 45;
  let end = Math.min(start + 120, 23*60 + 59);
  if (end - start < 30) end = Math.min(start + 60, 23*60 + 59);
  return {start: fromMin(start), end: fromMin(end)};
}
function recentGoals(dk){
  const out = [];
  for (let i = 1; i <= 12 && out.length < 4; i++) {
    const d = peekDay(addDays(dk, -i));
    if (!d) continue;
    d.blocks.slice().sort((a,b) => toMin(b.start) - toMin(a.start)).forEach(b => {
      if (b.goal && out.indexOf(b.goal) < 0 && b.goal !== 'Untitled') out.push(b.goal);
    });
  }
  return out.slice(0, 4);
}

/* ============================================================
   Dial
   ============================================================ */
function polar(cx, cy, r, deg){
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function arcPath(cx, cy, r, a0, a1){
  let sweep = a1 - a0;
  if (sweep <= 0) sweep += 1440;
  if (sweep >= 1439) sweep = 1439;
  const s = polar(cx, cy, r, (a0/1440)*360);
  const e = polar(cx, cy, r, ((a0 + sweep)/1440)*360);
  const large = sweep > 720 ? 1 : 0;
  return 'M' + s[0].toFixed(2) + ' ' + s[1].toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2);
}
function dialHTML(dk, day){
  const nm = nowMinFloat();
  const prev = peekDay(addDays(dk, -1));
  const wake = day ? day.wake : null;
  const sleep = day ? day.sleep : null;
  const prevSleep = prev ? prev.sleep : null;
  let paths = '';
  if (prevSleep && wake) paths += '<path class="arc-sleep" d="' + arcPath(80,80,62,toMin(prevSleep),toMin(wake)) + '"/>';
  if (day) {
    day.blocks.slice().sort((a,b) => toMin(a.start) - toMin(b.start)).forEach(b => {
      paths += '<path class="arc-block k-' + b.kind + ' s-' + b.status + '" d="' + arcPath(80,80,62,toMin(b.start),toMin(b.end)) + '"/>';
    });
  }
  if (sleep) paths += '<path class="arc-sleep" d="' + arcPath(80,80,62,toMin(sleep),1440) + '"/>';
  let ticks = '';
  for (let i = 0; i < 8; i++) {
    const a = polar(80, 80, i % 2 ? 72 : 70, i * 45);
    const b = polar(80, 80, 76, i * 45);
    ticks += '<line class="dial-tick" x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '"/>';
  }
  const labels = [[0,'00'],[360,'06'],[720,'12'],[1080,'18']].map(p => {
    const q = polar(80, 80, 84, (p[0]/1440)*360);
    return '<text class="dial-lab" x="' + q[0].toFixed(1) + '" y="' + q[1].toFixed(1) + '">' + p[1] + '</text>';
  }).join('');
  let pts = '';
  if (wake) { const q = polar(80,80,62,(toMin(wake)/1440)*360); pts += '<circle class="dial-pt" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.4" fill="var(--sun)"><title>Woke at '+fmtClock(wake)+'</title></circle>'; }
  if (sleep) { const q = polar(80,80,62,(toMin(sleep)/1440)*360); pts += '<circle class="dial-pt" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.4" fill="var(--slate)"><title>Slept at '+fmtClock(sleep)+'</title></circle>'; }
  const deg = (nm / 1440) * 360;
  const now = dt();
  let h = now.getHours(), mm = now.getMinutes(); const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12; if (h === 0) h = 12;
  let core;
  if (wake) {
    const awake = Math.max(0, nm - toMin(wake));
    core = '<small>awake ' + fmtDur(awake) + '</small>';
  } else if (prevSleep) {
    core = '<small>resting since ' + fmtShort(prevSleep) + '</small>';
  } else {
    core = '<small>a new day</small>';
  }
  return '<div class="dial-wrap" id="dialWrap">' +
    '<svg class="dial" viewBox="0 0 160 160" role="img" aria-label="' +
      esc('24 hour dial. ' + (wake ? 'Woke at ' + fmtClock(wake) + '. ' : '') + (sleep ? 'Slept at ' + fmtClock(sleep) + '. ' : '') + 'Now ' + fmtClock(fromMin(nm))) + '">' +
      '<circle class="dial-rim" cx="80" cy="80" r="62"/>' +
      '<circle class="dial-track" cx="80" cy="80" r="62"/>' +
      ticks + labels + paths + pts +
      '<g class="dial-hand" transform="rotate(' + deg.toFixed(2) + ' 80 80)"><line x1="80" y1="80" x2="80" y2="21"/></g>' +
      '<circle class="dial-hand-dot" cx="80" cy="21" r="3.8"/>' +
      '<circle class="dial-hub" cx="80" cy="80" r="2.6"/>' +
    '</svg>' +
    '<div class="dial-core" aria-hidden="true"><b>' + h + ':' + pad(mm) + '<i>' + ap + '</i></b>' + core + '</div>' +
  '</div>';
}

function metricRow(label, value, pct, color){
  const p = pct == null ? 0 : clamp(pct, 0, 1) * 100;
  return '<div class="metric" style="--mc:' + color + '"><span class="m-lab">' + label + '</span>' +
    '<div class="m-bar"><i style="width:' + p.toFixed(0) + '%"></i></div>' +
    '<span class="m-val">' + value + '</span></div>';
}
function ringHTML(score){
  const C = 2 * Math.PI * 66;
  const pct = score == null ? 0 : clamp(score, 0, 100) / 100;
  return '<div class="ring-wrap"><svg viewBox="0 0 160 160" aria-hidden="true">' +
    '<circle class="ring-bg" cx="80" cy="80" r="66"/>' +
    '<circle class="ring-fg" cx="80" cy="80" r="66" stroke-dasharray="' + (pct*C).toFixed(1) + ' ' + C.toFixed(1) + '"/>' +
    '</svg><div class="ring-txt"><b>' + (score == null ? '—' : score) + '<span>/100</span></b><small>' + (score == null ? 'no data' : tierOf(score).name) + '</small></div></div>';
}
function weekInsight(st){
  const bits = [];
  if (st.bestNight) {
    const d = parseKey(st.bestNight.key);
    bits.push('Best night: ' + DOW[d.getDay()] + ', ' + fmtDur(st.bestNight.dur));
  }
  if (st.wakeLogged) bits.push(st.wakeLogged + (st.wakeLogged === 1 ? ' morning' : ' mornings') + ' logged');
  if (st.blocksDue) bits.push(st.blocksKept + ' of ' + st.blocksDue + ' blocks kept');
  return bits.join(' · ');
}
function scorePanel(st){
  const score = st.score;

  return '<section class="panel score-panel">' + ringHTML(score) +
    '<div class="score-body">' +
      '<p class="eyebrow">Weekly score</p>' +
      '<h2>' + (score == null ? 'Your week is a blank page' : tierOf(score).name + ' week') + '</h2>' +
      '<p class="sub">' + scoreLine(score) + ' <span style="opacity:.8">(' + st.activeDays + ' of 7 days in play)</span></p>' +
      '<div class="metric-list">' +
        metricRow('Wake', st.wakeAvg == null ? '—' : fmtClock(fromMin(st.wakeAvg)), st.wakeScore, 'var(--sun)') +
        metricRow('Sleep', st.sleepAvg == null ? '—' : fmtDur(st.sleepAvg), st.sleepScore, 'var(--slate)') +
        metricRow('Gym', st.gym + ' of ' + state.settings.gymTarget, st.gymScore, 'var(--teal)') +
        metricRow('Lectures', st.lecPct == null ? '—' : Math.round(st.lecPct) + '%', st.lecScore, 'var(--blue)') +

      '</div>' +
      (insight ? '<p class="wk-note">' + icon('spark') + insight + '</p>' : '') +
    '</div>' +
  '</section>';
}
function dotsHTML(hits){
  return '<div class="dots">' + hits.map(h => '<i class="' + h + '"></i>').join('') + '</div>';
}
function goalCards(st){
  const tol = state.settings.tolerance;
  const wakeDots = st.rows.map(r => {
    if (!r.counts) return 'future';
    if (!r.day || !r.day.wake) return 'miss';
    return circDiff(toMin(r.day.wake), toMin(state.settings.wakeTarget)) <= tol ? 'hit' : 'miss';
  });
  const sleepDots = st.rows.map(r => {
    if (!r.counts) return 'future';
    const prev = peekDay(addDays(r.key, -1));
    if (!r.day || !r.day.wake || !prev || !prev.sleep) return 'miss';
    return durBetween(prev.sleep, r.day.wake) >= state.settings.sleepNeed * 60 ? 'hit' : 'miss';
  });
  const gymDots = st.rows.map(r => !r.counts ? 'future' : (r.day && r.day.gym ? 'hit' : 'miss'));
  const lecDots = st.rows.map(r => {
    if (!r.counts) return 'future';
    if (!r.day || !r.day.lectures.scheduled) return 'none';
    return (r.day.lectures.attended / r.day.lectures.scheduled * 100) >= state.settings.lectureTarget ? 'hit' : 'miss';
  });
  return '<div class="goals">' +
    '<article class="goal" style="--gc:var(--sun)"><div class="g-head">' + icon('sun') + 'Wake up</div>' +
      '<p class="g-big">' + (st.wakeAvg == null ? '—' : fmtClock(fromMin(st.wakeAvg))) + '</p>' +
      '<p class="g-target">target ' + fmtClock(state.settings.wakeTarget) + ' · ' + st.wakeOn + '/' + st.activeDays + ' on time</p>' + dotsHTML(wakeDots) + '</article>' +
    '<article class="goal" style="--gc:var(--slate)"><div class="g-head">' + icon('bed') + 'Sleep</div>' +
      '<p class="g-big">' + (st.sleepAvg == null ? '—' : fmtDur(st.sleepAvg)) + '<small>avg</small></p>' +
      '<p class="g-target">aim ' + state.settings.sleepNeed + 'h · ' + st.sleepOn + '/' + st.activeDays + ' nights</p>' + dotsHTML(sleepDots) + '</article>' +
    '<article class="goal" style="--gc:var(--teal)"><div class="g-head">' + icon('dumbbell') + 'Gym</div>' +
      '<p class="g-big">' + st.gym + '<small>of ' + state.settings.gymTarget + '</small></p>' +
      '<p class="g-target">sessions this week</p>' + dotsHTML(gymDots) + '</article>' +
    '<article class="goal" style="--gc:var(--blue)"><div class="g-head">' + icon('book') + 'Lectures</div>' +
      '<p class="g-big">' + (st.lecPct == null ? '—' : Math.round(st.lecPct) + '<small>%</small>') + '</p>' +
      '<p class="g-target">' + (st.sched ? st.att + ' of ' + st.sched + ' attended · aim ' + state.settings.lectureTarget + '%' : 'nothing logged yet') + '</p>' + dotsHTML(lecDots) + '</article>' +
  '</div>';
}
function wakePlot(st){
  const lo = 300, hi = 660;
  const tol = state.settings.tolerance;
  const target = toMin(state.settings.wakeTarget);
  const bandTop = clamp((hi - (target + tol)) / (hi - lo) * 100, 0, 100);
  const bandH = clamp((2 * tol) / (hi - lo) * 100, 0, 100);
  const pts = st.rows.map((r, i) => {
    if (!r.day || !r.day.wake) return '';
    const min = toMin(r.day.wake);
    if (min < lo - 60 || min > hi + 60) return '';
    const x = ((i + 0.5) / 7) * 100;
    const y = clamp((min - lo) / (hi - lo) * 100, 0, 100);
    const hit = circDiff(min, target) <= tol;
    return '<span class="pt ' + (hit ? 'hit' : 'miss') + '" style="left:' + x.toFixed(1) + '%;bottom:' + (100 - y).toFixed(1) + '%" title="' + DOW3[parseKey(r.key).getDay()] + ' ' + fmtClock(r.day.wake) + '"></span>';
  }).join('');
  return '<section class="panel chart"><h3>Wake times</h3>' +
    '<div class="plot"><span class="band" style="top:' + bandTop.toFixed(1) + '%;height:' + Math.max(2, bandH).toFixed(1) + '%"></span>' + pts + '</div>' +
    '<div class="axis"><span>5am</span><span>7am</span><span>9am</span><span>11am</span></div></section>';
}
function sleepBars(st){
  const need = state.settings.sleepNeed * 60;
  const bars = st.rows.map(r => {
    const prev = peekDay(addDays(r.key, -1));
    const dur = r.day && r.day.wake && prev && prev.sleep ? durBetween(prev.sleep, r.day.wake) : null;
    if (dur == null) return '<div class="bar"><i style="height:2px;opacity:.4"></i></div>';
    const h = clamp(dur / 600, 0.04, 1) * 100;
    return '<div class="bar ' + (dur >= need ? 'ok' : '') + '"><i style="height:' + h.toFixed(1) + '%"></i></div>';
  }).join('');
  const line = clamp(need / 600, 0, 1) * 100;
  return '<section class="panel chart"><h3>Sleep length</h3>' +
    '<div class="bars7" style="position:relative">' + bars + '<span class="need" style="bottom:' + line.toFixed(1) + '%"></span></div>' +
    '<div class="axis">' + st.keys.map(k => '<span>' + DOW3[parseKey(k).getDay()].slice(0,3) + '</span>').join('') + '</div></section>';
}
function dayList(st){
  const rows = st.rows.map(r => {
    const d = r.day;
    const prev = peekDay(addDays(r.key, -1));
    const dur = d && d.wake && prev && prev.sleep ? durBetween(prev.sleep, d.wake) : null;
    const blocks = d ? d.blocks : [];
    const done = blocks.filter(b => b.status === 'done').length;
    const today = r.key === logicalToday();
    return '<button class="dayrow' + (today ? ' today' : '') + '" type="button" data-act="open-day" data-date="' + r.key + '" aria-label="' + esc('Edit ' + DOW[parseKey(r.key).getDay()] + ' ' + parseKey(r.key).getDate() + ' ' + MONTHS[parseKey(r.key).getMonth()]) + '">' +
      '<div class="d-name">' + DOW3[parseKey(r.key).getDay()] + ' <small>' + parseKey(r.key).getDate() + '</small></div>' +
      '<div class="d-cell"><b>' + (d && d.wake ? fmtShort(d.wake) : '—') + '</b> wake</div>' +
      '<div class="d-cell"><b>' + (dur == null ? '—' : fmtDur(dur)) + '</b> sleep</div>' +
      '<div class="d-cell d-hide">' + (blocks.length ? done + ' of ' + blocks.length + ' blocks' : 'no blocks') + '</div>' +
      '<div class="d-cell"><span class="d-dot ' + (d && d.gym ? 'on' : '') + '"></span>' + (d && d.gym ? 'gym' : '—') + '</div>' +
      icon('chevR', 'd-go') +
    '</button>';
  }).join('');
  return '<section class="panel"><div class="panel-head"><h2>Day by day</h2><span class="muted">Tap a day to fix or plan it</span></div><div class="daylist">' + rows + '</div></section>';
}
function weekRewardCTA(st){
  const start = st.start;
  const claim = claimForWeek(start);
  if (claim) return '<div class="rwd-strip"><span class="big">' + icon('gift') + '</span><div><b style="font-size:13px">This week\'s reward: ' + esc(claim.title) + '</b><div class="txt">Claimed at a score of ' + claim.score + '. Enjoy it — you earned it.</div></div></div>';
  if (st.score == null) return '';
  const available = state.rewards.filter(r => r.need <= st.score);
  if (available.length) {
    const best = available.slice().sort((a,b) => b.need - a.need)[0];
    return '<div class="rwd-strip"><span class="big">' + icon('gift') + '</span><div style="flex:1;min-width:180px"><b style="font-size:13px">Ready to claim: ' + esc(best.title) + '</b><div class="txt">Your score of ' + st.score + ' clears the ' + best.need + '+ mark.</div></div><button class="btn primary sm" type="button" data-act="go-rewards">Pick your reward' + icon('arrow') + '</button></div>';
  }
  const next = state.rewards.slice().sort((a,b) => a.need - b.need).find(r => r.need > st.score);
  if (!next) return '';
  return '<div class="rwd-strip"><span class="big">' + icon('gift') + '</span><div><b style="font-size:13px">' + (next.need - st.score) + ' points to “' + esc(next.title) + '”</b><div class="txt">Small, steady wins get you there.</div></div></div>';
}

const IDEAS = ['A film night', 'Fancy coffee', 'New book', 'Long bath', 'A lie-in', 'Day trip'];
function viewRewards(){
  const start = weekStartOf(logicalToday());

  const tier = tierOf(score);
  const cards = state.rewards.slice().sort((a,b) => a.need - b.need).map(r => {
    const claimedThisWeek = claim && claim.rewardId === r.id;
    const unlocked = score != null && score >= r.need;
    const last = state.claimed.filter(c => c.rewardId === r.id).sort((a,b) => b.at - a.at)[0];
    const cls = claimedThisWeek ? 'claimed' : unlocked ? 'unlocked' : 'locked';

    if (claimedThisWeek) {
      stateTxt = 'Your pick this week';
      action = '<button class="btn sm" type="button" data-act="unclaim">Undo claim</button>';
    } else if (claim) {
      stateTxt = 'Already chose “' + claim.title + '” this week';
    } else if (unlocked) {
      stateTxt = 'Ready to claim';
      action = '<button class="btn sm primary" type="button" data-act="claim" data-id="' + r.id + '">' + icon('gift') + 'Claim it</button>';
    } else {
      stateTxt = score == null ? 'Needs a logged week' : 'Unlocks at ' + r.need + ' — you are at ' + score;

    '<div class="rwd-strip"><div><p class="eyebrow">This week</p><p class="big">' + (score == null ? '—' : score) + '<span style="font-size:13px;color:var(--muted)">/100</span></p></div>' +
      '<div class="txt" style="flex:1;min-width:160px"><b style="font-size:13px;color:var(--ink)">' + (score == null ? 'Not scored yet' : tier.name) + '</b><div>' + scoreLine(score) + '</div></div>' +
      '<button class="btn sm" type="button" data-act="go-week">See the week' + icon('arrow') + '</button></div>' +
    '<section class="panel"><div class="panel-head"><h2>Shelf</h2><span class="muted">' + plural(state.rewards.length, 'reward') + '</span></div>' +
      (state.rewards.length ? '<div class="panel-body"><div class="rwds">' + cards + '</div></div>' : '<div class="empty">' + icon('gift') + '<div>Nothing on the shelf yet. Add something worth a good week.</div><button class="btn sm primary" type="button" data-act="add-reward">' + icon('plus') + 'Add a reward</button></div>') +
